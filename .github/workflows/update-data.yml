name: Update EOD options data

on:
  schedule:
    # 22:15 UTC, Mon-Fri — safely after US market close (4pm ET) in both
    # EDT and EST. GitHub's schedule can lag by several minutes under load;
    # that's fine for an end-of-day job.
    - cron: '15 22 * * 1-5'
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch data
        run: python scripts/fetch_data.py

      - name: Commit updated data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --quiet --cached || git commit -m "Update EOD options data [automated]"
          git push
